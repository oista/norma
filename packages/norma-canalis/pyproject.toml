[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norma-canalis"
version = "0.2.0"
description = "Norma canalis — domain-agnostic connector contract for external systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
git = ["httpx>=0.27"]
sql = ["sqlalchemy>=2.0"]
all = ["norma-canalis[http,git,sql]"]

[project.entry-points."norma.canalis.drivers"]
http_rest = "norma.canalis.drivers.http_rest:HttpRestDriver"
sql_catalog = "norma.canalis.drivers.sql_catalog:SqlCatalogDriver"
git_repo = "norma.canalis.drivers.git_repo:GitRepoDriver"

[tool.setuptools.packages.find]
where = ["."]
include = ["norma*"]

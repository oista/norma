[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norma-forma"
version = "0.1.0"
description = "Norma forma — design token SSOT and emitters for the arête products"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
norma-forma = "norma.forma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["norma*"]
